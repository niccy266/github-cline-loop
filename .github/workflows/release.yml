name: Release

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify syntax and run tests
        run: |
          npm run lint
          npm test

      - name: Get current version from package.json
        id: version
        run: echo "VERSION=$(node -p \"require('./package.json').version\")" >> $GITHUB_OUTPUT

      - name: Check last release timestamp
        id: rate_limit
        run: |
          # Check if a release was made in the last 10 minutes
          LATEST=$(gh release list --repo "${{ github.repository }}" --limit 1 --json createdAt --jq '.[0].createdAt' 2>/dev/null || echo "")
          if [ -n "$LATEST" ]; then
            # Parse ISO timestamp and check if within 10 minutes
            NOW=$(date -u +%s)
            LATEST_EPOCH=$(date -d "$LATEST" +%s 2>/dev/null || echo "0")
            ELAPSED=$(( (NOW - LATEST_EPOCH) / 60 ))
            if [ "$ELAPSED" -lt 10 ]; then
              echo "skipped=true" >> $GITHUB_OUTPUT
              echo "Last release was ${ELAPSED} minutes ago; skipping to respect 10-minute cooldown"
            else
              echo "skipped=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "skipped=false" >> $GITHUB_OUTPUT
            echo "No previous releases found; proceeding"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create release if not rate-limited
        if: steps.rate_limit.outputs.skipped == 'false'
        run: |
          gh release create "${{ steps.version.outputs.VERSION }}" \
            --repo "${{ github.repository }}" \
            --title "Release ${{ steps.version.outputs.VERSION }}" \
            --notes "Automated release from commit ${{ github.sha }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image and upload as asset
        if: steps.rate_limit.outputs.skipped == 'false'
        run: |
          docker build -t github-cline-loop:${{ steps.version.outputs.VERSION }} .
          docker save github-cline-loop:${{ steps.version.outputs.VERSION }} | gzip > github-cline-loop-${{ steps.version.outputs.VERSION }}.tar.gz
          gh release upload "${{ steps.version.outputs.VERSION }}" github-cline-loop-${{ steps.version.outputs.VERSION }}.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}